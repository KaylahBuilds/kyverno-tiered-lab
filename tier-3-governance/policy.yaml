apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: kyverno-lab-approved-images
  labels:
    app.kubernetes.io/part-of: kyverno-tiered-lab
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  matchConditions:
    - name: lab-namespace-only
      expression: "object.metadata.namespace == 'kyverno-lab-tier3'"
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        has(object.metadata.labels) &&
        'team' in object.metadata.labels &&
        object.metadata.labels['team'] in ['platform', 'applications']
      message: "Use an approved team label: platform or applications."
    - expression: >-
        variables.containers.all(c,
          c.image.matches('^registry[.]example[.]invalid/(platform|applications)/[a-z0-9]+([._-][a-z0-9]+)*@sha256:[a-f0-9]{64}$'))
      message: "Use the lab registry, approved repository prefix, and a full lowercase SHA-256 digest."
