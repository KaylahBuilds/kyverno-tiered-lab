name: Policy checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-policy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the submitted revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Kyverno CLI with reviewed release checksum
        run: bash scripts/install-cli.sh
      - name: Test all three tiers with Kyverno
        run: .tools/kyverno test tier-1-audit tier-2-enforce tier-3-governance --detailed-results
  repository-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the submitted revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Check repository boundaries
        run: python -m unittest discover -s tests -v
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        root: [cloud/terraform/aks, cloud/terraform/eks, cloud/addons]
    steps:
      - name: Check out without persisting credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive cloud
      - name: Initialize provider schemas without a backend
        run: terraform -chdir=${{ matrix.root }} init -backend=false -input=false
      - name: Validate against native provider schemas
        run: terraform -chdir=${{ matrix.root }} validate
      - name: Run mocked plans without cloud or Kubernetes credentials
        run: terraform -chdir=${{ matrix.root }} test
  cloud-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out without persisting credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: 'v3.22.0'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Check cloud configuration boundaries
        run: python -m unittest discover -s cloud/tests -v
      - name: Render and inspect pinned AKS and EKS chart configurations
        run: bash cloud/tests/render.sh
