name: Policy checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-policy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the submitted revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned Kyverno CLI with reviewed release checksum
        run: bash scripts/install-cli.sh
      - name: Test all three tiers with Kyverno
        run: .tools/kyverno test tier-1-audit tier-2-enforce tier-3-governance --detailed-results
  repository-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the submitted revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Check repository boundaries
        run: python -m unittest discover -s tests -v
