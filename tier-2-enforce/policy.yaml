apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: kyverno-lab-pod-security
  labels:
    app.kubernetes.io/part-of: kyverno-tiered-lab
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  matchConditions:
    - name: lab-namespace-only
      expression: "object.metadata.namespace == 'kyverno-lab-tier2'"
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        (!has(object.spec.hostNetwork) || !object.spec.hostNetwork) &&
        (!has(object.spec.hostPID) || !object.spec.hostPID) &&
        (!has(object.spec.hostIPC) || !object.spec.hostIPC)
      message: "Host network, PID, and IPC namespaces are not allowed."
    - expression: >-
        !has(object.spec.volumes) || object.spec.volumes.all(v, !has(v.hostPath))
      message: "HostPath volumes are not allowed."
    - expression: >-
        variables.containers.all(c,
          has(c.securityContext) &&
          has(c.securityContext.runAsNonRoot) && c.securityContext.runAsNonRoot &&
          has(c.securityContext.runAsUser) && c.securityContext.runAsUser > 0 &&
          (!has(c.securityContext.privileged) || !c.securityContext.privileged) &&
          has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation &&
          has(c.securityContext.readOnlyRootFilesystem) && c.securityContext.readOnlyRootFilesystem &&
          has(c.securityContext.capabilities) &&
          has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop &&
          (!has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.size() == 0) &&
          has(c.securityContext.seccompProfile) && c.securityContext.seccompProfile.type == 'RuntimeDefault')
      message: "Every app, init, and ephemeral container needs explicit nonroot identity, no privilege escalation, read-only root, ALL capabilities dropped, and RuntimeDefault seccomp."
